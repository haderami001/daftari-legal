# Lancer le serveur et sa base PostgreSQL sur un poste de développement :
#     cd serveur && docker compose up --build
# Puis l'application :
#     flutter run --dart-define=API_URL=http://<ip-du-poste>:8080 \
#                 --dart-define=API_JETON=jeton-de-developpement-a-changer
# ⚠ Valeurs de développement : changez le jeton et le mot de passe en production.
services:
  base:
    image: postgres:16
    environment:
      POSTGRES_DB: peche
      POSTGRES_USER: peche
      POSTGRES_PASSWORD: peche-dev
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peche -d peche"]
      interval: 5s
      retries: 10

  serveur:
    build: .
    depends_on:
      base:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://peche:peche-dev@base:5432/peche
      JETON_API: jeton-de-developpement-a-changer
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  donnees:
