# Tests automatiques du serveur central (dossier serveur/).
name: serveur

on:
  push:
    branches: [main]
    paths:
      - 'serveur/**'
      - '.github/workflows/serveur.yml'
      - 'keycloak/**'
      - 'deploiement/**'
  pull_request:
    paths:
      - 'serveur/**'
      - 'keycloak/**'
      - 'deploiement/**'
      - '.github/workflows/serveur.yml'

concurrency:
  group: serveur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serveur
    # Une vraie base PostgreSQL pour les tests d'intégration.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peche_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.5.4'

      - name: Dépendances
        run: dart pub get

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib bin test

      - name: Analyse statique
        run: dart analyze --fatal-infos

      # Un vrai Keycloak avec le domaine « peche » (keycloak/realm-peche.json).
      - name: Keycloak
        working-directory: .
        run: |
          docker run -d --name keycloak -p 8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0.7 start-dev --import-realm
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/peche/.well-known/openid-configuration >/dev/null && exit 0
            sleep 3
          done
          docker logs keycloak; exit 1

      - name: Tests (API + PostgreSQL + Keycloak)
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/peche_test
          KEYCLOAK_URL_TEST: http://localhost:8180
        run: dart test

  # Vérifie que l'image de déploiement se construit.
  image-docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t peche-serveur serveur

  # Mise en ligne (deploiement/) : configuration Docker Compose et Caddy
  # valides, script d'installation sans erreur de syntaxe.
  deploiement:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploiement
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        run: |
          bash -n installer.sh
          cp .env.exemple .env
          sed -i 's/^MOT_DE_PASSE_BASE=$/MOT_DE_PASSE_BASE=x/; s/^MOT_DE_PASSE_ADMIN_KEYCLOAK=$/MOT_DE_PASSE_ADMIN_KEYCLOAK=x/' .env
          docker compose config --quiet
          set -a; . ./.env; set +a
          docker run --rm -e DOMAINE_API -e DOMAINE_AUTH -e EMAIL_ACME \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
