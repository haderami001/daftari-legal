# Tests automatiques du serveur central (dossier serveur/).
name: serveur

on:
  push:
    branches: [main]
    paths:
      - 'serveur/**'
      - '.github/workflows/serveur.yml'
  pull_request:
    paths:
      - 'serveur/**'
      - '.github/workflows/serveur.yml'

concurrency:
  group: serveur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serveur
    # Une vraie base PostgreSQL pour les tests d'intégration.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peche_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.5.4'

      - name: Dépendances
        run: dart pub get

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib bin test

      - name: Analyse statique
        run: dart analyze --fatal-infos

      - name: Tests (API + PostgreSQL)
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/peche_test
        run: dart test

  # Vérifie que l'image de déploiement se construit.
  image-docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t peche-serveur serveur
