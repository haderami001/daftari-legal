# Tests automatiques de l'application Flutter « Pêche Conforme ».
# Se lance à chaque push sur main et à chaque pull request qui touche peche_app/
# (ou les règles partagées peche_regles/).
name: peche_app

on:
  push:
    branches: [main]
    paths:
      - 'peche_app/**'
      # Le test de bout en bout de l'application démarre le serveur.
      - 'serveur/**'
      # Règles partagées avec l'app Inspecteur.
      - 'peche_regles/**'
      - '.github/workflows/peche_app.yml'
  pull_request:
    paths:
      - 'peche_app/**'
      # Le test de bout en bout de l'application démarre le serveur.
      - 'serveur/**'
      # Règles partagées avec l'app Inspecteur.
      - 'peche_regles/**'
      - '.github/workflows/peche_app.yml'

concurrency:
  group: peche_app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse-et-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peche_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Les tests de la base locale utilisent SQLite installé sur la machine.
      - name: SQLite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      # Le code Drift généré (*.g.dart) est versionné : on vérifie qu'il
      # correspond bien aux tables (sinon : lancer build_runner et committer).
      - name: Code généré à jour
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test.log
          statut=${PIPESTATUS[0]}
          if [ "$statut" -ne 0 ]; then
            # Résumé des échecs en annotation, lisible sans télécharger le journal.
            resume=$(grep -E -B2 -A14 "EXCEPTION CAUGHT|\[E\]$" test.log | head -c 12000 \
              | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests en échec::${resume}"
          fi
          exit "$statut"

  # Application Android installable : téléchargeable depuis l'onglet
  # « Actions » de GitHub (section Artifacts) pour l'essayer sur un téléphone.
  apk-android:
    needs: analyse-et-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peche_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Construire l'APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee ../apk.log

      # En cas d'échec, la fin du journal devient une annotation (visible
      # dans l'onglet « Checks » de la PR, et lisible par l'API).
      - name: Résumé de l'erreur Android
        if: failure()
        run: |
          tail -n 60 ../apk.log | python3 -c "import sys,urllib.parse; print('::error title=APK::' + sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))"

      - uses: actions/upload-artifact@v4
        with:
          name: peche-conforme-apk
          path: peche_app/build/app/outputs/flutter-apk/app-debug.apk

      # Démonstration complète sur téléphone, sans réseau : le serveur du
      # dépôt tourne dans l'application (tableau de bord, administration).
      - name: Construire l'APK de démonstration complète
        run: |
          flutter build apk --debug --dart-define=SERVEUR_DEMO=true
          mv build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/peche-conforme-demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: peche-conforme-apk-demo
          path: peche_app/build/app/outputs/flutter-apk/peche-conforme-demo.apk

  # Version navigateur (la même que la simulation) : téléchargeable aussi.
  web:
    needs: analyse-et-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peche_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Préparer SQLite et pdf.js pour le web
        run: flutter pub get && ./tool/preparer_web.sh

      - name: Construire la version web
        # CanvasKit (moteur par défaut, même rendu du texte que sur téléphone :
        # l'arabe et les nombres s'affichent correctement), servi avec l'app.
        run: flutter build web --no-web-resources-cdn --pwa-strategy none

      - uses: actions/upload-artifact@v4
        with:
          name: peche-conforme-web
          path: peche_app/build/web
