# Régénère le code Drift (*.g.dart), les traductions et le formatage, puis
# committe le résultat sur la branche choisie. À lancer à la main
# (onglet Actions → « Régénérer le code » → Run workflow), par exemple après
# un changement de tables, quand on n'a pas Flutter sous la main.
name: Régénérer le code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peche_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Code Drift et traductions
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - name: Formatage
        run: dart format lib test tool
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then echo "Rien à régénérer"; exit 0; fi
          git commit -m "Régénère le code (build_runner, gen-l10n, dart format)"
          git push
