name: inspecteur_app
description: "Assistant de l'inspecteur des pêches : textes, calculs et nouveautés réglementaires"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  # Même moteur de calcul et même référentiel que Pêche Conforme.
  peche_regles:
    path: ../peche_regles

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Polices embarquées (licence SIL OFL, voir assets/fonts/OFL.txt), les
  # mêmes que Pêche Conforme : même rendu partout, y compris hors ligne.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

  # Génère lib/l10n/app_localizations*.dart depuis les fichiers .arb
  # (voir l10n.yaml).
  generate: true
